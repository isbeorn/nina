name: Complete Version Release

on:
  workflow_run:
    workflows:
      - Build and Test
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: complete-version-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  complete:
    name: Merge Validated Version Pull Request
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'automation/version-bump/') }}
    runs-on: ubuntu-latest

    steps:
    - name: Validate and merge version pull request
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const run = context.payload.workflow_run;

          let pullRequests = run.pull_requests || [];
          if (pullRequests.length === 0) {
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: run.head_sha,
            });
            pullRequests = response.data;
          }

          const candidates = pullRequests.filter(pr =>
            pr.head?.sha === run.head_sha &&
            pr.head?.ref === run.head_branch
          );

          if (candidates.length !== 1) {
            core.notice(`Ignoring workflow run ${run.id}: expected one associated pull request for ${run.head_sha}, found ${candidates.length}.`);
            return;
          }

          const pullNumber = candidates[0].number;
          let { data: pull } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: pullNumber,
          });

          const allowedBase = pull.base.ref === 'develop' ||
            pull.base.ref === 'master' ||
            /^release\/.+$/.test(pull.base.ref);
          const validVersionPullRequest = pull.user.login === 'github-actions[bot]' &&
            pull.head.repo?.full_name === `${owner}/${repo}` &&
            pull.head.ref.startsWith('automation/version-bump/') &&
            allowedBase;

          if (!validVersionPullRequest) {
            core.notice(`Ignoring pull request #${pullNumber}: it is not a CI-created version pull request.`);
            return;
          }

          if (pull.state === 'closed') {
            if (!pull.merged || !pull.merge_commit_sha) {
              core.notice(`Ignoring pull request #${pullNumber}: it was closed without merging.`);
              return;
            }

            if (Number(process.env.GITHUB_RUN_ATTEMPT) === 1) {
              core.notice(`Ignoring pull request #${pullNumber}: it has already been merged and publication was previously dispatched.`);
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'publish-version',
              client_payload: {
                pull_request_number: pullNumber,
                merge_commit_sha: pull.merge_commit_sha,
                target_branch: pull.base.ref,
              },
            });
            core.notice(`Publication was dispatched again for pull request #${pullNumber} after rerunning this completion workflow.`);
            return;
          }

          if (pull.head.sha !== run.head_sha) {
            core.notice(`Ignoring stale workflow run ${run.id}: pull request #${pullNumber} has changed.`);
            return;
          }

          for (let attempt = 0; attempt < 5 && pull.mergeable_state === 'unknown'; attempt++) {
            await new Promise(resolve => setTimeout(resolve, 2000));
            ({ data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            }));
          }

          if (pull.mergeable_state === 'behind') {
            await github.rest.pulls.updateBranch({
              owner,
              repo,
              pull_number: pullNumber,
              expected_head_sha: pull.head.sha,
            });
            core.notice(`Updated pull request #${pullNumber}. Its new Build and Test run requires owner approval.`);
            return;
          }

          const merge = await github.rest.pulls.merge({
            owner,
            repo,
            pull_number: pullNumber,
            sha: pull.head.sha,
            merge_method: 'squash',
            commit_title: pull.title,
            commit_message: `Automated version increment from pull request #${pullNumber}.`,
          });

          if (!merge.data.merged || !merge.data.sha) {
            core.setFailed(`GitHub did not merge pull request #${pullNumber}: ${merge.data.message || 'unknown reason'}`);
            return;
          }

          await github.rest.repos.createDispatchEvent({
            owner,
            repo,
            event_type: 'publish-version',
            client_payload: {
              pull_request_number: pullNumber,
              merge_commit_sha: merge.data.sha,
              target_branch: pull.base.ref,
            },
          });

          try {
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${pull.head.ref}`,
            });
          } catch (error) {
            if (error.status !== 404) {
              core.warning(`Merged pull request #${pullNumber}, but could not delete ${pull.head.ref}: ${error.message}`);
            }
          }

          await core.summary
            .addHeading('Version pull request merged')
            .addLink(`#${pullNumber}`, pull.html_url)
            .addRaw(`\n\nPublication dispatched for ${merge.data.sha}.`)
            .write();
