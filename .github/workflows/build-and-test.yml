name: Build and Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - release/3.2.x

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: nschloe/action-cached-lfs-checkout@v1
      with:
        submodules: recursive

    - name: Test release workflow policy
      run: node --test .github/scripts/merge-version-pull-request.test.js .github/scripts/release-version.test.js

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore NINA.sln

    - name: Build main project
      run: dotnet build NINA/NINA.csproj --configuration Debug --no-restore

    - name: Build test project
      run: dotnet build NINA.Test/NINA.Test.csproj --configuration Debug --no-restore

    - name: Run unit tests
      run: dotnet test NINA.Test/NINA.Test.csproj --configuration Debug --no-build -p:PlatformTarget=x64 --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Verify published 3.2 plugin compatibility
      shell: pwsh
      run: ./.github/scripts/test-plugin-compatibility.ps1

    - name: Upload NUnit test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: TestResults/*.trx
        if-no-files-found: warn

  merge-version-pull-request:
    name: Merge Validated Version Pull Request
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'automation/version-bump/') &&
        (
          github.base_ref == 'develop' ||
          github.base_ref == 'master' ||
          startsWith(github.base_ref, 'release/')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
    - name: Checkout trusted merge policy
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
        sparse-checkout: .github/scripts

    - name: Validate and merge version pull request
      uses: actions/github-script@v7
      with:
        script: |
          const mergeVersionPullRequest = require('./.github/scripts/merge-version-pull-request.js');
          await mergeVersionPullRequest({ github, context, core });
