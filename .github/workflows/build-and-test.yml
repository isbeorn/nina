name: Build and Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: nschloe/action-cached-lfs-checkout@v1
      with:
        submodules: recursive

    - name: Test release workflow policy
      run: node --test .github/scripts/merge-version-pull-request.test.js

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore NINA.sln

    - name: Build main project
      run: dotnet build NINA/NINA.csproj --configuration Debug --no-restore

    - name: Build test project
      run: dotnet build NINA.Test/NINA.Test.csproj --configuration Debug --no-restore

    - name: Run unit tests
      run: dotnet test NINA.Test/NINA.Test.csproj --configuration Debug --no-build -p:PlatformTarget=x64 --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Publish NUnit test results
      uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}
      with:
        name: NUnit Tests
        path: TestResults/test-results.trx
        reporter: dotnet-trx

  merge-version-pull-request:
    name: Merge Validated Version Pull Request
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'automation/version-bump/') &&
        (
          github.base_ref == 'develop' ||
          github.base_ref == 'master' ||
          startsWith(github.base_ref, 'release/')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
    - name: Checkout trusted merge policy
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
        sparse-checkout: .github/scripts

    - name: Validate and merge version pull request
      uses: actions/github-script@v7
      with:
        script: |
          const mergeVersionPullRequest = require('./.github/scripts/merge-version-pull-request.js');
          await mergeVersionPullRequest({ github, context, core });
